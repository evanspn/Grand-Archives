[package]
name = "archivist"
description = "Find and download free books across Project Gutenberg, Open Library and the Internet Archive — a library and a CLI, built for gideon on the Kobo"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/evanspn/grand-archives"

[lib]
path = "src/lib.rs"

[[bin]]
name = "archivist"
path = "src/main.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
# Bundled Mozilla roots: the Kobo's own CA bundle is years stale.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
